name: Build MYKC Kernel Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev kmod \
            zip unzip python3 git make wget curl cpio
          echo "=== 磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h

      - name: 下载 Android clang 工具链
        run: |
          set -o pipefail
          mkdir -p $HOME/tc && cd $HOME/tc
          echo "下载 prebuilt clang (镜像 + 重试)..."
          OK=0
          for MIRROR in \
            "https://github.com/aosp-mirror/platform_prebuilts_clang_host_linux-x86" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86" ; do
            for TRY in 1 2 3; do
              echo "--- mirror=$MIRROR try=$TRY ---"
              rm -rf clang-tc
              if git clone --depth 1 "$MIRROR" clang-tc 2>&1 | tail -3; then
                if ls $HOME/tc/clang-tc/clang-r*/bin/clang >/dev/null 2>&1; then OK=1; break; fi
              fi
              sleep 5
            done
            [ "$OK" = "1" ] && break
          done
          if [ "$OK" != "1" ]; then echo "!! clang 下载失败"; exit 1; fi
          CLANG=$(ls $HOME/tc/clang-tc/clang-r*/bin/clang 2>/dev/null | sort | tail -1)
          if [ -z "$CLANG" ]; then
            CLANG=$(find $HOME/tc/clang-tc -name clang -type f -path '*bin*' | head -1)
          fi
          if [ -z "$CLANG" ]; then echo "!! 找不到 clang 可执行文件"; exit 1; fi
          CLANG_DIR=$(dirname "$CLANG")
          echo "CLANG_BIN=$CLANG" >> $GITHUB_ENV
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR" >> $GITHUB_PATH
          export PATH="$CLANG_DIR:$PATH"
          echo "clang = $CLANG"
          $CLANG --version | head -2
          echo "=== 工具链自检 (ld.lld 必须在 PATH) ==="
          ls -la "$CLANG_DIR"/ld.lld "$CLANG_DIR"/llvm-ar "$CLANG_DIR"/llvm-nm 2>&1 | head -6
          "$CLANG_DIR"/ld.lld --version 2>&1 | head -2

      - name: 下载 GKI 内核源码 (KMI android15-6.6)
        run: |
          set -o pipefail
          mkdir -p $HOME/gki && cd $HOME/gki
          OK=0
          for MIRROR in \
            "https://github.com/aosp-mirror/kernel_common" \
            "https://android.googlesource.com/kernel/common" ; do
            for TRY in 1 2 3; do
              echo "--- gki mirror=$MIRROR try=$TRY ---"
              rm -rf common
              if git clone --depth 1 -b android15-6.6 "$MIRROR" common 2>&1 | tail -3; then
                if [ -f common/Makefile ]; then OK=1; break; fi
              fi
              sleep 8
            done
            [ "$OK" = "1" ] && break
          done
          if [ "$OK" != "1" ]; then echo "!! GKI 源码下载失败"; exit 1; fi
          cd common
          echo "=== 内核版本 (原始) ==="
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' || true
          # ★★★ 路线 B 修正: AOSP android15-6.6 HEAD 是 6.6.111, 设备真实是 6.6.118
          #   vermagic 第一段 6.6.xxx 必须精确匹配, 故直接 patch Makefile SUBLEVEL
          ORIG_SUB=$(grep -E '^SUBLEVEL *=' Makefile | head -1 | sed 's/[^0-9]//g')
          echo "ORIG_SUBLEVEL=$ORIG_SUB -> patch to 118"
          sed -i 's/^SUBLEVEL *=.*/SUBLEVEL = 118/' Makefile
          grep -E '^SUBLEVEL *=' Makefile | head -1
          echo "=== 内核版本 (patch 后) ==="
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' || true
          echo "KERNEL_DIR=$HOME/gki/common" >> $GITHUB_ENV

      - name: 生成模块构建环境 (不编 vmlinux)
        run: |
          set -o pipefail
          cd $HOME/gki/common
          CLANG=${{ env.CLANG_BIN }}

          # ============================================================
          # ★★★ v18 核心: 使用设备真实配置 kdev.config (而非 gki_defconfig) ★★★
          #
          # 根因 (v17 实证): gki_defconfig 与设备实际配置差异巨大
          #   设备: KASAN=y + KASAN_HW_TAGS=y + KASAN_VMALLOC=y + KFENCE=y
          #   云端 gki_defconfig: 全关
          # 后果: struct page / task_struct / mm_struct / struct pid /
          #       struct miscdevice 布局全部不同 => 19 个符号 CRC 对不上
          #
          # 解法: 直接用从设备 dump 出来的 kdev.config 当 .config
          #   (仓库根目录 kdev.config, 7760 行, 来自 /proc/config.gz)
          # ============================================================
          echo "=== 使用设备真实配置 kdev.config ==="
          if [ ! -f $GITHUB_WORKSPACE/kdev.config ]; then
            echo "!! 严重: kdev.config 不存在于仓库根目录"; exit 1
          fi
          cp -f $GITHUB_WORKSPACE/kdev.config .config
          echo "kdev.config 行数: $(wc -l < .config)"

          # 逐项显式打印设备关键配置 (供日志核对)
          echo "=== 设备关键配置 (来自 kdev.config) ==="
          grep -E '^CONFIG_(KASAN|KASAN_HW_TAGS|KASAN_VMALLOC|KFENCE|MEMCG|MEMCG_KMEM|SLUB|HARDENED_USERCOPY|ARM64_4K_PAGES|ARM64_PA_BITS|SHADOW_CALL_STACK|CFI_CLANG|LTO_NONE|MODVERSIONS)=' .config || true

          # 允许未签名模块
          ./scripts/config --file .config -d MODULE_SIG_FORCE 2>/dev/null || true
          ./scripts/config --file .config -e MODULE_SIG 2>/dev/null || true
          # ★ 核心: 开 MODVERSIONS -> vermagic 带 modversions 单词 (设备内核 CONFIG_MODVERSIONS=y)
          ./scripts/config --file .config -e MODVERSIONS 2>/dev/null || true
          # ★ 把 LOCALVERSION 对齐设备内核, 让 vermagic 第一段也一致 (双保险)
          ./scripts/config --file .config --set-str LOCALVERSION "-android15-8-gc44b714366cc-abogki519650608-4k" 2>/dev/null || true
          ./scripts/config --file .config -d LOCALVERSION_AUTO 2>/dev/null || true
          # ★★★ 路线 B 核心: 强制开启 CFI_CLANG (设备内核 CONFIG_CFI_CLANG=y 严格模式)
          #   不开 CFI 的模块没有 __kcfi_typeid_* 符号 => 间接调用被内核 check_cfi 拦 => BUG => 秒重启
          ./scripts/config --file .config -e CFI_CLANG 2>/dev/null || true
          #
          # ★★★ v15 关键修正 ★★★
          #   v14 这里写的是 -d CFI_PERMISSIVE, 明确关掉"宽容模式", 让设备保持
          #   严格模式, 再靠 mykc_cfi.c 把 report_cfi_failure 入口改成 ret 硬绕。
          #   而 report_cfi_failure 是 __noreturn 函数(末尾 BUG()), 改成 ret
          #   会跳到调用者的 LR —— 那个值是垃圾 —— 于是取指异常 -> panic -> 重启。
          #
          #   正确做法: 让模块自己不带 CFI 不匹配的间接调用风险。
          #   两个选项:
          #     (a) 模块侧全部用 KCFLAGS="-fsanitize=kcfi" 编译, 并由同一
          #         GKI 树生成 __kcfi_typeid_* —— 但跨树 typeid 由字符串哈希
          #         决定, 只要编译器版本一致就能对上, 这是 v14 想走的路;
          #     (b) 模块内部**不做任何函数指针间接调用** (v15 已把 esp 里
          #         的函数指针调用全部改成直接调用), 从根上不触发 CFI。
          #
          #   v15 同时做 (a)+(b), 并且不再 patch 内核代码段。
          #   注意: 这里**不**改 CFI_PERMISSIVE —— 那是整机内核行为, 我们只
          #   编外部模块, 改了也不影响设备内核, 所以干脆不碰。
          ./scripts/config --file .config -e CFI_ICALL_NORMALIZE_INTEGERS 2>/dev/null || true
          # ★★★ 路线 B 关键修正: kCFI 的 __kcfi_typeid_* 符号需要 LTO 才能在链接期生成
          # ============================================================
          # ★ v18: 保持 LTO_NONE, 与设备 kdev.config 完全一致
          #   实证: CFI_CLANG=y + LTO_NONE=y + 完整编 vmlinux => typeid 正常生成
          # ============================================================
          ./scripts/config --file .config -d LTO_CLANG 2>/dev/null || true
          ./scripts/config --file .config -d LTO_CLANG_THIN 2>/dev/null || true
          ./scripts/config --file .config -d LTO_CLANG_FULL 2>/dev/null || true
          ./scripts/config --file .config -e LTO_NONE 2>/dev/null || true
          echo "=== olddefconfig 前 KASAN 状态 ==="
          grep -E '^CONFIG_(KASAN|KASAN_HW_TAGS|KASAN_VMALLOC|KFENCE)=' .config || true
          echo "=== olddefconfig ==="
          make ARCH=arm64 CC=$CLANG LLVM=1 olddefconfig 2>&1 | tail -5
          echo "=== olddefconfig 后 KASAN 状态 ==="
          grep -E '^CONFIG_(KASAN|KASAN_HW_TAGS|KASAN_VMALLOC|KFENCE)=' .config || true
          echo "=== .config 关键项自检 ==="
          grep -E '^CONFIG_(MODVERSIONS|MODULE_SIG|MODULE_SIG_FORCE|LOCALVERSION)' .config || true
          grep -E '^CONFIG_(CFI_CLANG|CFI_PERMISSIVE|SHADOW_CALL_STACK|ARM64_PTR_AUTH_KERNEL)' .config || true
          # ============================================================
          # ★ v18: 硬断言 KASAN 全家桶必须保留 (决定 19 个 CRC 是否匹配)
          # ============================================================
          echo "=== KASAN 硬断言 ==="
          KFAIL=0
          for K in KASAN KASAN_HW_TAGS KASAN_VMALLOC KFENCE; do
            if grep -q "^CONFIG_${K}=y" .config; then
              echo "  OK: CONFIG_${K}=y"
            else
              echo "  !! 丢失: CONFIG_${K} (olddefconfig 可能不识别该项)"
              KFAIL=1
            fi
          done
          if [ "$KFAIL" = "1" ]; then
            echo "!! 严重: KASAN 配置项在 olddefconfig 后丢失"
            echo "   说明 ACK 开源树不支持这些项, 需要换策略"
            echo "--- .config 中实际存在的 KASAN 行 ---"
            grep -iE '^#? ?CONFIG_KASAN' .config || echo "  (完全不存在)"
            exit 1
          fi
          echo "OK: KASAN 全家桶全部保留"

          if ! grep -q '^CONFIG_MODVERSIONS=y' .config; then
            echo "!! CONFIG_MODVERSIONS 未生效, 中止"; exit 1
          fi
          if ! grep -q '^CONFIG_CFI_CLANG=y' .config; then
            echo "!! 警告: CONFIG_CFI_CLANG 未生效 (继续, 但产物可能再次崩机)"
          else
            echo "OK: CONFIG_CFI_CLANG=y 已开启"
          fi
          echo "=== LTO / CFI 最终状态自检 (v18: 必须 LTO_NONE) ==="
          grep -E '^CONFIG_(LTO_CLANG_THIN|LTO_CLANG_FULL|LTO_NONE|CFI_CLANG|CFI_PERMISSIVE)=' .config || true
          if ! grep -q '^CONFIG_LTO_NONE=y' .config; then
            echo "!! 严重: CONFIG_LTO_NONE 未生效"; exit 1
          fi
          echo "OK: CONFIG_LTO_NONE=y"

          # ============================================================
          # ★★★ v18 核心: 完整编 vmlinux (唯一能让 kCFI typeid 生效的方式) ★★★
          #   实证 run 39045715936: modules_prepare => typeid=0
          #                        make Image modules => typeid=1
          # ============================================================
          echo "=== 完整编译 vmlinux + modules (约 25~40 分钟) ==="
          set +e
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 Image modules > /tmp/kbuild.log 2>&1
          MK=$?
          set -e
          echo "=== make 退出码: $MK ==="
          if [ "$MK" -ne 0 ]; then
            echo "==================== [A] 所有 error 行 ===================="
            grep -aE 'error:|fatal error:|Error [0-9]|No such file|undefined' /tmp/kbuild.log | head -60 || true
            echo "==================== [B] 首个 error 上下文 ===================="
            grep -a -n -m5 'error:' /tmp/kbuild.log > /tmp/errlines.txt || true
            if [ -s /tmp/errlines.txt ]; then
              cat /tmp/errlines.txt || true
              F=$(head -1 /tmp/errlines.txt | cut -d: -f1)
              echo "---- 首个 error 在第 $F 行, 前后上下文 ----"
              S=$((F-5)); if [ "$S" -lt 1 ]; then S=1; fi
              E=$((F+15))
              awk -v s=$S -v e=$E 'NR>=s && NR<=e' /tmp/kbuild.log || true
            else
              echo "(无 'error:' 行, 打印最后 120 行)"
              tail -120 /tmp/kbuild.log || true
            fi
            echo "==================== [C] 日志最后 50 行 ===================="
            tail -50 /tmp/kbuild.log || true
            echo "==================== 日志总行数 ===================="
            wc -l /tmp/kbuild.log || true
            echo "!! 编译失败"; exit 1
          fi
          echo "==================== 编译成功, 日志末 20 行 ===================="
          tail -20 /tmp/kbuild.log || true
          echo "=== vmlinux 产物确认 ==="
          ls -la vmlinux arch/arm64/boot/Image Module.symvers 2>&1 || true
          echo "=== Module.symvers 条目数 ==="
          wc -l Module.symvers 2>&1 || true
          echo "=== vmlinux 内 kCFI typeid 计数 (应 > 0) ==="
          readelf -sW vmlinux 2>/dev/null | grep -c kcfi_typeid || echo 0
          if [ ! -f Module.symvers ]; then
            echo "!! 严重: Module.symvers 未生成, 编译未真正完成"; exit 1
          fi
          echo "OK: 完整编译完成, Module.symvers 就绪"

      - name: 编译 + 打补丁 + 校验 mykc_core.ko
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE
          CLANG=${{ env.CLANG_BIN }}
          export PATH="${{ env.CLANG_DIR }}:$PATH"

          echo "=== PATH 自检 ==="
          which ld.lld || echo "!! ld.lld 不在 PATH"

          echo "=== 编译模块 (★ 显式开启 kCFI) ==="
          # ★★★ 路线 B 核心: 外部模块编译必须显式传 -fsanitize=kcfi,
          #   否则产物没有 __kcfi_typeid_* 段 => 内核 check_cfi 拦截 => BUG => 秒重启
          #   设备内核: CONFIG_CFI_CLANG=y + CFI_PERMISSIVE 未开 (严格模式)
          # ★★★ kCFI flag 用 KCFLAGS 传 (内核 Makefile 对 KCFLAGS 有最高优先级,
          #     ccflags-y 在外部模块路径下可能被覆盖 —— 实证 run #57: typeid=0)
          # ★ 先探测 clang 是否支持 -fsanitize=kcfi, 失败则退回不传
          CFI_OK=0
          if echo 'int main(void){return 0;}' > /tmp/t.c && \
             $CLANG -fsanitize=kcfi -c /tmp/t.c -o /tmp/t.o 2>/dev/null; then
            CFI_OK=1
            echo "OK: clang 支持 -fsanitize=kcfi"
          else
            echo "!! clang 不支持 -fsanitize=kcfi (将不传该 flag)"
          fi

          echo "=== 编译模块 (V=1 打印真实命令行) ==="
          # ★★★ v15 修复: 去掉 `|| true`。
          #   v14 用 `|| true` 吞掉编译失败, 靠后面 readelf 静态检查兜底,
          #   结果「编译带错但有 .ko 产出」的产物被当成成功上传 ——
          #   这类半坏产物正是重启的高危来源。v15 只要 make 非 0 就整体失败。
          set -e
          if [ "$CFI_OK" = "1" ]; then
            make -C ${{ env.KERNEL_DIR }} \
              M=$GITHUB_WORKSPACE \
              ARCH=arm64 \
              CC=$CLANG \
              LD=ld.lld \
              LLVM=1 \
              KBUILD_MODPOST_WARN=1 \
              KCFLAGS="-fsanitize=kcfi -Wno-unused-command-line-argument" \
              V=1 \
              modules > /tmp/build.log 2>&1
          else
            make -C ${{ env.KERNEL_DIR }} \
              M=$GITHUB_WORKSPACE \
              ARCH=arm64 \
              CC=$CLANG \
              LD=ld.lld \
              LLVM=1 \
              KBUILD_MODPOST_WARN=1 \
              V=1 \
              modules > /tmp/build.log 2>&1
          fi
          set +e

          echo "===== BUILD LOG SIZE ====="
          wc -l /tmp/build.log || true
          echo "===== ★ 真实 clang 命令行 (前 3 条完整行) ====="
          grep -aE '(clang|cc1).*-c ' /tmp/build.log | head -3 || echo "(未抓到 clang 命令行)"
          echo "===== ★ 所有含 sanitize 的行 ====="
          grep -a 'sanitize' /tmp/build.log | head -20 || echo "(build.log 中无 sanitize 字样)"
          echo "===== ★ KCFLAGS 是否出现在命令行 ====="
          grep -a 'KCFLAGS\|-fsanitize=kcfi' /tmp/build.log | head -10 || echo "(命令行未含 -fsanitize=kcfi)"
          echo "===== 编译错误/警告 (前 40 行) ====="
          grep -aE 'error|Error|warning:' /tmp/build.log | head -40 || echo "(无 error/warning)"
          echo "===== 日志尾部 30 行 ====="
          tail -30 /tmp/build.log || true

          echo "=== 产物 ==="
          ls -la *.ko 2>/dev/null || { echo "!! 无 .ko 产出"; exit 1; }
          if [ ! -f mykc_core.ko ]; then echo "!! mykc_core.ko 不存在"; exit 1; fi

          # ★ v16: 最小探针模块也要过 CRC (用于逐层定位 insmod 崩溃点)
          if [ ! -f mykc_probe.ko ]; then
            echo "!! mykc_probe.ko 不存在 (Step 0 探针未编出)"
            exit 1
          fi
          echo "OK: mykc_probe.ko 已产出 ($(wc -c < mykc_probe.ko) bytes)"

          modinfo mykc_core.ko 2>/dev/null | head -12 || true

          echo "=== [0/4] ★ CFI 状态检查 (A 路线: 不追求 typeid) ==="
          KCFI_N=$(readelf -sW mykc_core.ko 2>/dev/null | grep -c 'kcfi_typeid' || true)
          echo "KCFI_TYPEID_COUNT=$KCFI_N"
          echo "  (A 路线说明: 外部模块不跑 LTO 链接, typeid 可 == 0; 这不算失败)"
          CFI_SYM=$(readelf -sW mykc_core.ko 2>/dev/null | grep -c 'mykc_cfi' || true)
          echo "MYKC_CFI_SYMBOLS=$CFI_SYM"
          if [ "$CFI_SYM" -lt 1 ]; then
            echo "FAIL: mykc_cfi 未链接进模块 (A 路线核心缺失)"
            exit 1
          fi
          echo "OK: mykc_cfi CFI-bypass 已链接 ($CFI_SYM 条符号)"
          echo "--- CFI 相关段/符号预览 ---"
          readelf -sW mykc_core.ko 2>/dev/null | grep -iE 'cfi' | head -10 || echo "(无 cfi 相关符号)"
          echo "--- UND 表里的 CFI 依赖 (应为空或仅 patch_text) ---"
          readelf -sW mykc_core.ko 2>/dev/null | awk '$7=="UND"{print $8}' | grep -iE 'cfi|patch_text' || echo "(无)"

          echo "=== [1/3] vermagic 校验 (必须含 modversions) ==="
          VM=$(strings mykc_core.ko | grep -m1 '^vermagic=' || true)
          echo "GOT: $VM"
          case "$VM" in
            *modversions*) echo "OK: vermagic 含 modversions" ;;
            *) echo "FAIL: vermagic 缺 modversions"; exit 1 ;;
          esac

          echo "=== [2/3] 禁用符号 UND 校验 ==="
          # ★ 注意: grep -c 无匹配时退出码=1, 在 bash -e 下会误杀整个脚本 -> 必须 || true
          UND=$(readelf -sW mykc_core.ko 2>/dev/null | awk '$7=="UND"{print $8}' | sort -u)
          echo "$UND" | head -80
          BAD=$(echo "$UND" | grep -cE '^(kallsyms_lookup_name|_text|__pte_offset_map)$' || true)
          echo "BAD_COUNT=$BAD"
          if [ "$BAD" != "0" ]; then echo "FAIL: 仍引用未导出符号"; exit 1; fi
          echo "OK: UND 表干净"
          echo "kprobe 相关符号数: $(echo "$UND" | grep -cE 'kprobe' || true)"

          echo "=== [3/3] 写入真实 CRC 的真 __versions 段 ==="
          # ★★★ v15 关键修复 ★★★
          #   v14 用 add_versions2.py 追加 **size=0** 的空 __versions 段,
          #   目的是让内核 check_version() 循环空转, 从而放行全部符号。
          #   这等于把整机 ABI 校验关掉: 只要任一符号真实 ABI 与设备不符,
          #   内核在调用它那一刻就会读错参数/越界 -> panic -> 重启。
          #
          #   v15 改为写**真实 CRC**: 先把设备官方模块的 __versions 表
          #   dump 成 crcs.txt (仓库里已带一份, 也可现场重新生成), 再逐符号填表。
          CRC_TABLE=$GITHUB_WORKSPACE/crcs.txt
          if [ ! -s "$CRC_TABLE" ]; then
            echo "!! crcs.txt 不存在或为空, 无法安全写 __versions"
            echo "   请在设备上执行: python3 crc_dump.py /vendor/lib/modules > crcs.txt"
            exit 1
          fi
          echo "crcs.txt 行数: $(wc -l < $CRC_TABLE)"
          python3 $GITHUB_WORKSPACE/add_versions2.py mykc_core.ko --crc-table $CRC_TABLE
          readelf -SW mykc_core.ko | grep -E '__versions|Name' || true

          # 硬校验: 段必须存在且 size > 0 (size==0 就是 v14 的老问题)
          VSZ=$(readelf -SW mykc_core.ko | awk '/__versions/ {print $6}' | head -1)
          echo "__versions size = $VSZ"
          if [ -z "$VSZ" ] || [ "$VSZ" = "0" ]; then
            echo "FAIL: __versions 为空 (等于关闭 ABI 校验, 禁止发布)"
            exit 1
          fi
          echo "OK: __versions 已写入真实 CRC ($VSZ bytes)"

          # 交叉自检: 用同一张表反查模块里的每条记录是否对得上
          python3 $GITHUB_WORKSPACE/verify_crc.py mykc_core.ko $CRC_TABLE || {
            echo "FAIL: __versions 内容与 crc 表不一致"; exit 1; }
          echo "=== 最终尺寸 ==="; ls -la mykc_core.ko

          echo "=== [4/4] 给 mykc_probe.ko 也写入真实 CRC ==="
          python3 $GITHUB_WORKSPACE/add_versions2.py mykc_probe.ko --crc-table $CRC_TABLE
          PSZ=$(readelf -SW mykc_probe.ko | awk '/__versions/ {print $6}' | head -1)
          echo "probe __versions size = $PSZ"
          if [ -z "$PSZ" ] || [ "$PSZ" = "0" ]; then
            echo "FAIL: mykc_probe.ko 的 __versions 为空"; exit 1
          fi
          python3 $GITHUB_WORKSPACE/verify_crc.py mykc_probe.ko $CRC_TABLE || {
            echo "FAIL: mykc_probe.ko CRC 不一致"; exit 1; }
          echo "OK: mykc_probe.ko 已就绪 ($(wc -c < mykc_probe.ko) bytes)"

      - name: 生成自释放脚本
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f mykc_core.ko ]; then
            echo "❌ 未产出 mykc_core.ko"; ls -la *.o *.ko 2>/dev/null || true; exit 1
          fi
          printf '#!/bin/sh\n# mykc self-extract + insmod\nset -e\nTMP=$(mktemp)\ntrap "rm -f \\"$TMP\\"" EXIT INT TERM\nbase64 -d <<'"'"'__MYKC_KO__'"'"' > "$TMP"\n' > mykc.ko.sh
          base64 mykc_core.ko >> mykc.ko.sh
          printf '__MYKC_KO__\ninsmod "$TMP"\nif [ $? -eq 0 ]; then echo "mykc loaded OK"; else echo "FAILED"; exit 1; fi\n' >> mykc.ko.sh
          chmod 755 mykc.ko.sh
          echo "打包完成: $(wc -c < mykc.ko.sh) bytes"

          # ★ v16: 探针模块的自释放脚本 (Step 0, 只有打印, 不碰内核)
          printf '#!/bin/sh\n# mykc_probe self-extract + insmod\nset -e\nTMP=$(mktemp)\ntrap "rm -f \\"$TMP\\"" EXIT INT TERM\nbase64 -d <<'"'"'__MYKC_PROBE__'"'"' > "$TMP"\n' > mykc_probe.sh
          base64 mykc_probe.ko >> mykc_probe.sh
          printf '__MYKC_PROBE__\ninsmod "$TMP"\nif [ $? -eq 0 ]; then echo "mykc_probe STEP0 loaded OK"; else echo "FAILED"; exit 1; fi\n' >> mykc_probe.sh
          chmod 755 mykc_probe.sh
          echo "探针打包完成: $(wc -c < mykc_probe.sh) bytes"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mykc-module
          path: |
            mykc_core.ko
            mykc.ko.sh
            mykc_probe.ko
            mykc_probe.sh
          retention-days: 30