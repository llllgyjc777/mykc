name: Build MYKC Kernel Module v3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev kmod \
            zip unzip python3 git make wget curl cpio binutils
          echo "=== 磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h

      - name: 下载 Android clang 工具链
        run: |
          mkdir -p $HOME/tc && cd $HOME/tc
          git clone --depth 1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-tc 2>&1 | tail -3
          CLANG=$(ls $HOME/tc/clang-tc/clang-r*/bin/clang 2>/dev/null | sort | tail -1)
          if [ -z "$CLANG" ]; then
            CLANG=$(find $HOME/tc/clang-tc -name clang -type f -path '*bin*' | head -1)
          fi
          echo "CLANG_BIN=$CLANG" >> $GITHUB_ENV
          echo "clang = $CLANG"
          $CLANG --version | head -2

      - name: 下载 GKI 预编译内核产物 (KMI android15-6.6)
        run: |
          cd $HOME
          mkdir -p gki && cd gki
          git clone --depth 1 -b android15-6.6 \
            https://android.googlesource.com/kernel/common \
            common 2>&1 | tail -3
          cd common
          echo "=== 检查是否含 Module.symvers ==="
          ls -la Module.symvers 2>/dev/null || echo "无 Module.symvers(正常,浅克隆)"
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL'
          echo "KERNEL_DIR=$HOME/gki/common" >> $GITHUB_ENV

      - name: 生成模块构建环境 (不需要编整个内核)
        run: |
          cd ${{ env.KERNEL_DIR }}
          CLANG=${{ env.CLANG_BIN }}
          make ARCH=arm64 CC=$CLANG LLVM=1 gki_defconfig 2>&1 | tail -5
          ./scripts/config --file .config -d MODULE_SIG_FORCE 2>/dev/null || true
          ./scripts/config --file .config -e MODULE_SIG 2>/dev/null || true
          make ARCH=arm64 CC=$CLANG LLVM=1 olddefconfig 2>&1 | tail -3
          echo "=== modules_prepare ==="
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 modules_prepare 2>&1 | tail -15
          echo "=== ★ 编 vmlinux 生成 Module.symvers ==="
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 vmlinux 2>&1 | tail -20 || \
            echo "!! vmlinux 编译未完全成功, 继续"
          echo "=== 检查 Module.symvers ==="
          ls -la Module.symvers 2>/dev/null && wc -l Module.symvers || echo "无 Module.symvers"

      - name: 编译 mykc_core.ko
        run: |
          cd $GITHUB_WORKSPACE
          CLANG=${{ env.CLANG_BIN }}
          echo "=== 开始编译模块 ==="
          make -C ${{ env.KERNEL_DIR }} \
            M=$GITHUB_WORKSPACE \
            ARCH=arm64 \
            CC=$CLANG \
            LLVM=1 \
            KBUILD_MODPOST_WARN=1 \
            modules 2>&1 | tail -40
          echo "=== 编译产物 ==="
          ls -la *.ko 2>/dev/null || echo "!! 无 .ko 产出"
          modinfo mykc_core.ko 2>/dev/null | head -10 || true

      - name: ★ UND 符号强校验 (v3 核心关卡)
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f mykc_core.ko ]; then
            echo "❌ 编译失败，未产出 mykc_core.ko"; exit 1
          fi
          echo "=== 全量 UND 符号 ==="
          readelf -sW mykc_core.ko | awk '$7=="UND" {print $8}' | sort -u | tee /tmp/und.txt
          echo "=== 检查禁用的未导出符号 ==="
          FAIL=0
          for s in kallsyms_lookup_name _text __pte_offset_map; do
            if grep -qx "$s" /tmp/und.txt; then
              echo "❌ 发现禁用符号: $s (会致 insmod 失败/崩机)"
              FAIL=1
            fi
          done
          echo "=== 检查 __versions 段 (应为 0 或极小) ==="
          readelf -SW mykc_core.ko | grep -i versions || echo "(无 __versions 段)"
          echo "=== vermagic ==="
          modinfo mykc_core.ko | grep vermagic || true
          if [ $FAIL -eq 1 ]; then
            echo "!!!!! v3 校验失败: 仍存在未导出符号引用 !!!!!"
            exit 1
          fi
          echo "✅ v3 校验通过: 无禁用符号"

      - name: 生成自释放脚本
        run: |
          cd $GITHUB_WORKSPACE
          ls -la mykc_core.ko
          printf '#!/bin/sh\n# mykc v3 self-extract + insmod\nset -e\nTMP=$(mktemp)\ntrap "rm -f \\"$TMP\\"" EXIT INT TERM\nbase64 -d <<'"'"'__MYKC_KO__'"'"' > "$TMP"\n' > mykc.ko.sh
          base64 mykc_core.ko >> mykc.ko.sh
          printf '__MYKC_KO__\ninsmod "$TMP"\nif [ $? -eq 0 ]; then echo "mykc loaded OK"; else echo "FAILED"; exit 1; fi\n' >> mykc.ko.sh
          chmod 755 mykc.ko.sh
          echo "打包完成: $(wc -c < mykc.ko.sh) bytes"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mykc-module-v3
          path: |
            mykc_core.ko
            mykc.ko.sh
          retention-days: 30