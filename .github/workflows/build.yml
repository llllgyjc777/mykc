name: Build MYKC Kernel Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev kmod \
            zip unzip python3 git make wget curl cpio
          echo "=== 磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h

      - name: 下载 Android clang 工具链
        run: |
          set -o pipefail
          mkdir -p $HOME/tc && cd $HOME/tc
          echo "下载 prebuilt clang (镜像 + 重试)..."
          OK=0
          for MIRROR in \
            "https://github.com/aosp-mirror/platform_prebuilts_clang_host_linux-x86" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86" ; do
            for TRY in 1 2 3; do
              echo "--- mirror=$MIRROR try=$TRY ---"
              rm -rf clang-tc
              if git clone --depth 1 "$MIRROR" clang-tc 2>&1 | tail -3; then
                if ls $HOME/tc/clang-tc/clang-r*/bin/clang >/dev/null 2>&1; then OK=1; break; fi
              fi
              sleep 5
            done
            [ "$OK" = "1" ] && break
          done
          if [ "$OK" != "1" ]; then echo "!! clang 下载失败"; exit 1; fi
          CLANG=$(ls $HOME/tc/clang-tc/clang-r*/bin/clang 2>/dev/null | sort | tail -1)
          if [ -z "$CLANG" ]; then
            CLANG=$(find $HOME/tc/clang-tc -name clang -type f -path '*bin*' | head -1)
          fi
          if [ -z "$CLANG" ]; then echo "!! 找不到 clang 可执行文件"; exit 1; fi
          echo "CLANG_BIN=$CLANG" >> $GITHUB_ENV
          echo "clang = $CLANG"
          $CLANG --version | head -2
          CLANG_DIR=$(dirname "$CLANG")
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR" >> $GITHUB_PATH
          export PATH="$CLANG_DIR:$PATH"
          echo "=== 工具链自检 ==="
          ls -la "$CLANG_DIR"/ld.lld "$CLANG_DIR"/llvm-ar "$CLANG_DIR"/llvm-nm 2>&1 | head -6
          "$CLANG_DIR"/ld.lld --version 2>&1 | head -2
          # ★ 关键修复: 把 clang 工具链 bin 加入 PATH -> make 才能找到 ld.lld
          CLANG_DIR=$(dirname "$CLANG")
          echo "$CLANG_DIR" >> $GITHUB_PATH
          export PATH="$CLANG_DIR:$PATH"
          echo "=== 工具链自检 ==="
          ls -la "$CLANG_DIR"/ld.lld "$CLANG_DIR"/llvm-ar "$CLANG_DIR"/llvm-nm 2>&1 | head -6
          "$CLANG_DIR"/ld.lld --version 2>&1 | head -2

      - name: 下载 GKI 预编译内核产物 (KMI android15-6.6)
        run: |
          cd $HOME
          # 官方 GKI 预编译: 含 vmlinux + Module.symvers + headers，不用编内核
          echo "尝试下载 GKI 预编译包..."
          mkdir -p gki && cd gki

          # 方式: 从 kernel/common 分支直接拉构建产物
          # Google 提供 prebuilt KMI 在 android.googlesource.com 的特定 tag
          OK=0
          for MIRROR in \
            "https://github.com/aosp-mirror/kernel_common" \
            "https://android.googlesource.com/kernel/common" ; do
            for TRY in 1 2 3; do
              echo "--- gki mirror=$MIRROR try=$TRY ---"
              rm -rf common
              if git clone --depth 1 -b android15-6.6 "$MIRROR" common 2>&1 | tail -3; then
                if [ -f common/Makefile ]; then OK=1; break; fi
              fi
              sleep 8
            done
            [ "$OK" = "1" ] && break
          done
          if [ "$OK" != "1" ]; then echo "!! GKI 源码下载失败"; exit 1; fi

          cd common
          echo "=== 检查是否含 Module.symvers ==="
          ls -la Module.symvers 2>/dev/null || echo "无 Module.symvers(正常,浅克隆)"

          echo "=== 内核版本 ==="
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL'

          echo "KERNEL_DIR=$HOME/gki/common" >> $GITHUB_ENV

      - name: 生成模块构建环境 (不需要编整个内核)
        run: |
          cd ${{ env.KERNEL_DIR }}
          CLANG=${{ env.CLANG_BIN }}

          echo "=== 用 gki_defconfig 生成 .config ==="
          make ARCH=arm64 CC=$CLANG LLVM=1 gki_defconfig 2>&1 | tail -5

          # 关键: 允许未签名模块
          ./scripts/config --file .config -d MODULE_SIG_FORCE 2>/dev/null || true
          ./scripts/config --file .config -e MODULE_SIG 2>/dev/null || true
          # MYKC: 打开 CONFIG_MODVERSIONS -> vermagic 带 modversions (设备内核要求)
          ./scripts/config --file .config -e MODVERSIONS 2>/dev/null || true
          ./scripts/config --file .config -d MODULE_SIG_FORCE 2>/dev/null || true
          make ARCH=arm64 CC=$CLANG LLVM=1 olddefconfig 2>&1 | tail -3

          echo "=== modules_prepare (生成头文件 + 符号表) ==="
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 modules_prepare 2>&1 | tail -15

          echo "=== ★ 编 vmlinux 生成 Module.symvers（关键步骤，可能要 30-60 分钟）==="
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 vmlinux 2>&1 | tail -20 || \
            echo "!! vmlinux 编译未完全成功，继续用 KBUILD_MODPOST_WARN 兜底"
          echo "=== 检查 Module.symvers ==="
          ls -la Module.symvers 2>/dev/null && wc -l Module.symvers || echo "无 Module.symvers"

      - name: 编译 mykc_core.ko
        run: |
          cd $GITHUB_WORKSPACE
          CLANG=${{ env.CLANG_BIN }}
          export PATH="${{ env.CLANG_DIR }}:$PATH"
          echo "=== PATH 自检 ==="
          which ld.lld || echo "!! ld.lld 不在 PATH"
          echo "=== 开始编译模块 ==="
          # KBUILD_MODPOST_WARN=1: 未解析符号降级为警告，保证出 .ko
          make -C ${{ env.KERNEL_DIR }} \
            M=$GITHUB_WORKSPACE \
            ARCH=arm64 \
            CC=$CLANG \
            LD=ld.lld \
            LLVM=1 \
            KBUILD_MODPOST_WARN=1 \
            modules 2>&1 | tail -40

          echo "=== 编译产物 ==="
          ls -la *.ko 2>/dev/null || echo "!! 无 .ko 产出"
          modinfo mykc_core.ko 2>/dev/null | head -10 || true
          echo "=== MYKC vermagic 强校验 ==="
          VM=$(strings mykc_core.ko | grep -m1 "^vermagic=")
          echo "GOT: $VM"
          case "$VM" in
            *modversions*) echo "OK: vermagic 含 modversions" ;;
            *) echo "FAIL: vermagic 缺 modversions"; exit 1 ;;
          esac
          echo "=== MYKC 禁用符号 UND 强校验 ==="
          UND=$(readelf -sW mykc_core.ko 2>/dev/null | awk '$7=="UND"{print $8}' | sort -u)
          echo "$UND" | head -80
          BAD=$(echo "$UND" | grep -cE '^(kallsyms_lookup_name|_text|__pte_offset_map)$')
          echo "BAD_COUNT=$BAD"
          if [ "$BAD" != "0" ]; then
            echo "❌ 仍引用未导出符号"; exit 1
          fi
          echo "✅ UND 表干净"
          # 确认 kprobe 符号已进来（v4 特征）
          echo "KP: $(echo "$UND" | grep -cE 'kprobe')"

      - name: 生成自释放脚本
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f mykc_core.ko ]; then
            echo "❌ 编译失败，未产出 mykc_core.ko"
            echo "--- 列出所有 .o 看线索 ---"
            ls -la *.o *.ko 2>/dev/null
            exit 1
          fi
          ls -la mykc_core.ko

          printf '#!/bin/sh\n# mykc self-extract + insmod\nset -e\nTMP=$(mktemp)\ntrap "rm -f \\"$TMP\\"" EXIT INT TERM\nbase64 -d <<'"'"'__MYKC_KO__'"'"' > "$TMP"\n' > mykc.ko.sh
          base64 mykc_core.ko >> mykc.ko.sh
          printf '__MYKC_KO__\ninsmod "$TMP"\nif [ $? -eq 0 ]; then echo "mykc loaded OK"; else echo "FAILED"; exit 1; fi\n' >> mykc.ko.sh
          chmod 755 mykc.ko.sh
          echo "打包完成: $(wc -c < mykc.ko.sh) bytes"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mykc-module
          path: |
            mykc_core.ko
            mykc.ko.sh
          retention-days: 30