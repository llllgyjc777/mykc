name: Build MYKC Kernel Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖 + 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev kmod \
            zip unzip python3 git make wget curl cpio xz-utils \
            clang lld llvm gcc-aarch64-linux-gnu
          # Ubuntu 自带 clang 版本
          clang --version | head -2
          ld.lld --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          echo "CLANG_BIN=$(which clang)" >> $GITHUB_ENV
          echo "=== 内存 ==="; free -h

      - name: 下载 GKI 内核源码 (tarball 直链, 不 clone)
        run: |
          cd $HOME
          mkdir -p common && cd common
          echo "下载 kernel/common android15-6.6 tarball..."
          url="https://android.googlesource.com/kernel/common/+archive/refs/heads/android15-6.6.tar.gz"
          wget -q --tries=3 --timeout=120 -O k.tar.gz "$url" || {
            echo "尝试 github 镜像..."
            wget -q --tries=3 -O k.tar.gz \
              "https://github.com/aosp-mirror/kernel_common/archive/refs/heads/android15-6.6.tar.gz"
            tar -xzf k.tar.gz --strip-components=1
          }
          if [ -f k.tar.gz ]; then tar -xzf k.tar.gz 2>&1 | tail -3; fi
          echo "=== 解压后文件数 ==="
          ls | wc -l
          echo "=== 内核版本 ==="
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL' Makefile 2>/dev/null | head -3
          echo "KERNEL_DIR=$HOME/common" >> $GITHUB_ENV

      - name: 生成模块构建环境
        run: |
          cd ${{ env.KERNEL_DIR }}
          CLANG=${{ env.CLANG_BIN }}
          export PATH=$(dirname $CLANG):$PATH
          echo "=== gki_defconfig ==="
          make ARCH=arm64 LLVM=1 gki_defconfig 2>&1 | tail -5
          ./scripts/config --file .config -d MODULE_SIG_FORCE 2>/dev/null || true
          make ARCH=arm64 LLVM=1 olddefconfig 2>&1 | tail -3
          echo "=== modules_prepare ==="
          make -j$(nproc) ARCH=arm64 LLVM=1 modules_prepare 2>&1 | tail -15

      - name: 编译 mykc_core.ko
        run: |
          cd $GITHUB_WORKSPACE
          export PATH=$(dirname ${{ env.CLANG_BIN }}):$PATH
          echo "=== 编译模块 ==="
          make -C ${{ env.KERNEL_DIR }} \
            M=$GITHUB_WORKSPACE \
            ARCH=arm64 LLVM=1 \
            modules 2>&1 | tail -50
          echo "=== 产物 ==="
          ls -la *.ko 2>/dev/null || echo "!! 无 .ko"
          modinfo mykc_core.ko 2>/dev/null | head -8 || true

      - name: 生成自释放脚本
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f mykc_core.ko ]; then
            echo "❌ 编译失败"
            ls -la *.o 2>/dev/null | head
            exit 1
          fi
          ls -la mykc_core.ko
          printf '#!/bin/sh\nset -e\nTMP=$(mktemp)\ntrap "rm -f \\"$TMP\\"" EXIT INT TERM\nbase64 -d <<'"'"'__MYKC_KO__'"'"' > "$TMP"\n' > mykc.ko.sh
          base64 mykc_core.ko >> mykc.ko.sh
          printf '__MYKC_KO__\ninsmod "$TMP" && echo "mykc loaded OK" || echo "FAILED"\n' >> mykc.ko.sh
          chmod 755 mykc.ko.sh
          echo "打包: $(wc -c < mykc.ko.sh) bytes"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mykc-module
          path: |
            mykc_core.ko
            mykc.ko.sh
          retention-days: 30