name: Build MYKC Kernel Module
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev kmod \
            zip unzip python3 git make wget curl cpio xz-utils
          echo "=== 磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h

      - name: 下载 Android clang 18 工具链 (锁定 r510928, 对齐设备内核)
        run: |
          mkdir -p $HOME/tc && cd $HOME/tc
          echo "下载 prebuilt clang r510928 (clang 18.0.0)..."
          # ★ 探针实测: main 分支无此目录(404),
          #   tag android-15.0.0_r1 存在(clang-r510928?format=TEXT => 200)
          #   +archive 语法可下到真 gzip (探针已验: gzip compressed data)
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r1/clang-r510928.tar.gz"
          echo "URL=$URL"
          curl -sL -m 900 -o clang18.tar.gz "$URL"
          ls -la clang18.tar.gz
          echo "=== 文件类型 ==="
          file clang18.tar.gz
          mkdir -p clang18 && tar xzf clang18.tar.gz -C clang18
          echo "=== 解压后顶层 ==="
          ls -la $HOME/tc/clang18 | head -20
          CLANG=$HOME/tc/clang18/bin/clang
          if [ ! -x "$CLANG" ]; then
            echo "!! bin/clang 不存在, 尝试找 clang 可执行:"; find $HOME/tc/clang18 -maxdepth 3 -name 'clang' -type f | head -10; exit 1
          fi
          CLANG_DIR=$(dirname "$CLANG")
          echo "CLANG_BIN=$CLANG" >> $GITHUB_ENV
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR" >> $GITHUB_PATH
          echo "clang = $CLANG"
          echo "clang_dir = $CLANG_DIR"
          $CLANG --version | head -3
          "${CLANG_DIR}/ld.lld" --version 2>&1 | head -2 || true

      - name: 下载 GKI 源码树 (KMI android15-6.6)
        run: |
          cd $HOME
          echo "下载 GKI 源码树..."
          mkdir -p gki && cd gki
          git clone --depth 1 -b android15-6.6 \
            https://github.com/aosp-mirror/kernel_common \
            common 2>&1 | tail -3
          git -C common log -1 --format='%H %s' 2>/dev/null | head -1
          cd common
          echo "=== 内核版本 ==="
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL'
          echo "KERNEL_DIR=$HOME/gki/common" >> $GITHUB_ENV

      - name: 生成模块构建环境
        run: |
          cd ${{ env.KERNEL_DIR }}
          CLANG=${{ env.CLANG_BIN }}
          export PATH="${{ env.CLANG_DIR }}:$PATH"
          echo "PATH 前段 = $(echo $PATH | cut -d: -f1)"
          which ld.lld || echo "!! which ld.lld 失败"
          echo "=== 生成 .config (gki_defconfig) ==="
          set +e
          make ARCH=arm64 CC=$CLANG LLVM=1 LD=ld.lld gki_defconfig > /tmp/defconfig.log 2>&1
          RC=$?
          echo "--- gki_defconfig 退出码 = $RC ---"
          tail -25 /tmp/defconfig.log
          if [ $RC -ne 0 ]; then
            echo "❌ gki_defconfig 失败!"; cat /tmp/defconfig.log; exit 1
          fi
          set -e
          ./scripts/config --file .config -d MODULE_SIG_FORCE 2>/dev/null || true
          ./scripts/config --file .config -e MODULE_SIG 2>/dev/null || true
          echo "=== olddefconfig ==="
          set +e
          make ARCH=arm64 CC=$CLANG LLVM=1 LD=ld.lld olddefconfig > /tmp/olddef.log 2>&1
          RC=$?
          echo "--- olddefconfig 退出码 = $RC ---"
          tail -10 /tmp/olddef.log
          if [ $RC -ne 0 ]; then
            echo "❌ olddefconfig 失败!"; cat /tmp/olddef.log; exit 1
          fi
          set -e
          echo "=== modules_prepare ==="
          set +e
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 LD=ld.lld modules_prepare > /tmp/prep.log 2>&1
          RC=$?
          echo "--- modules_prepare 退出码 = $RC ---"
          tail -25 /tmp/prep.log
          if [ $RC -ne 0 ]; then
            echo "❌ modules_prepare 失败!"; tail -100 /tmp/prep.log; exit 1
          fi
          set -e
          echo "=== 编 vmlinux ==="
          set +e
          set -o pipefail
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 LD=ld.lld vmlinux 2>&1 | tee /tmp/vmlinux.log | tail -30
          VMLINUX_RC=${PIPESTATUS[0]}
          set +o pipefail
          echo "=== vmlinux 编译退出码 = $VMLINUX_RC ==="
          if [ $VMLINUX_RC -ne 0 ]; then
            echo "❌ vmlinux 编译失败!"; tail -120 /tmp/vmlinux.log; exit 1
          fi
          echo "=== 编 modules 生成 Module.symvers ==="
          set +e
          set -o pipefail
          make -j$(nproc) ARCH=arm64 CC=$CLANG LLVM=1 LD=ld.lld modules 2>&1 | tee /tmp/modules.log | tail -20
          MODULES_RC=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          echo "=== modules 编译退出码 = $MODULES_RC ==="
          ls -la Module.symvers vmlinux.symvers 2>/dev/null || true
          if [ ! -f Module.symvers ]; then
            echo "❌ 致命: Module.symvers 未生成"; tail -60 /tmp/modules.log; exit 1
          fi
          echo "✅ Module.symvers 已生成, 行数: $(wc -l < Module.symvers)"

      - name: 编译模块 (去掉 BTI, 对齐设备)
        run: |
          cd $GITHUB_WORKSPACE
          CLANG=${{ env.CLANG_BIN }}
          export PATH="${{ env.CLANG_DIR }}:$PATH"
          echo "=== 开始编译模块 ==="
          # ★ 关键修复: 设备 CONFIG_ARM64_BTI_KERNEL 未设,
          #   原厂模块 .note.gnu.property = 0x02 (仅 PAC),
          #   用 -mbranch-protection=standard 会产生 0x04 (BTI) → 加载失败
          set -o pipefail
          make -C ${{ env.KERNEL_DIR }} \
            M=$GITHUB_WORKSPACE \
            ARCH=arm64 \
            CC=$CLANG \
            LLVM=1 \
            LD=ld.lld \
            CFLAGS_MODULE="-mbranch-protection=pac-ret" \
            modules 2>&1 | tail -80
          MAKE_RC=${PIPESTATUS[0]}
          echo "make 退出码 = $MAKE_RC"
          echo "=== 编译产物 ==="
          ls -la *.ko 2>/dev/null || echo "!! 无 .ko 产出"
          if [ ! -f mykc_core.ko ]; then
            echo "❌ 编译未产出 mykc_core.ko (make_rc=$MAKE_RC)"; exit 1
          fi
          if [ "$MAKE_RC" != "0" ]; then
            echo "❌ make 返回非零 ($MAKE_RC)"; exit 1
          fi
          echo "✅ 编译成功"

      - name: 校验符号表
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== UND 符号检查 ==="
          llvm-nm -u mykc_core.ko 2>/dev/null | head -60 || nm -u mykc_core.ko | head -60

      - name: 校验并修正 vermagic + CRC (所有 .ko)
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_VER="6.6.118-android15-8-gc44b714366cc-abogki519650608-4k"
          echo "=== 修正前 ==="
          for f in *.ko; do
            echo "--- $f ---"
            modinfo $f 2>/dev/null | grep -E 'vermagic|name' || true
          done
          # ★ 修复: 遍历所有 .ko 一起 patch (原版只处理 mykc_core.ko)
          for f in *.ko; do
            echo "=== patch vermagic: $f ==="
            python3 patch_vermagic.py "$f" "${f%.ko}_vt.ko" "$TARGET_VER" || echo "(patch 失败: $f)"
            if [ -f "${f%.ko}_vt.ko" ]; then
              mv "${f%.ko}_vt.ko" "$f"
            fi
          done
          echo "=== 修正后 ==="
          for f in *.ko; do
            echo "--- $f ---"
            modinfo $f 2>/dev/null | grep -E 'vermagic|name' || true
          done

      - name: 校验 gnu.property (确认无 BTI)
        run: |
          cd $GITHUB_WORKSPACE
          for f in *.ko; do
            echo "--- $f ---"
            readelf -n $f 2>/dev/null | grep -A2 'gnu.property' || true
          done

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mykc-module
          path: |
            *.ko
            patch_vermagic.py
          if-no-files-found: error