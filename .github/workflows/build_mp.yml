# build_mp.yml — 一次性编译 STEP 0~5 六个 mp.ko
#
# 放到仓库 .github/workflows/ 下，手动触发。
# 产物: mp_s0.ko ~ mp_s5.ko 六个文件
#
# 目标内核: 6.6.118-android15-8-gc44b714366cc-abogki519650608-4k
# KMI: android15-8 / Android 16 / kernel 6.6

name: Build Minimal Probe (mp.ko STEP 0-5)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'GKI kernel branch'
        required: false
        default: 'android15-6.6'

env:
  KERNEL_REPO: 'https://android.googlesource.com/kernel/common'
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 安装依赖 ----------
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev \
            cpio rsync zip unzip xz-utils \
            python3 git make gcc

      # ---------- 拉内核源码 ----------
      - name: Clone kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" kernel_src 2>&1 | tail -5
          echo "=== 内核版本 ==="
          head -5 kernel_src/Makefile

      # ---------- 下载 clang ----------
      - name: Get clang
        run: |
          mkdir -p $HOME/tc && cd $HOME/tc
          echo "下载 prebuilt clang (AOSP 镜像 + 重试)..."
          OK=0
          for MIRROR in \
            "https://github.com/aosp-mirror/platform_prebuilts_clang_host_linux-x86" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86" ; do
            for TRY in 1 2 3; do
              echo "--- mirror=$MIRROR try=$TRY ---"
              rm -rf clang-tc
              if git clone --depth 1 "$MIRROR" clang-tc 2>&1 | tail -3; then
                if ls $HOME/tc/clang-tc/clang-r*/bin/clang >/dev/null 2>&1; then OK=1; break; fi
              fi
              sleep 5
            done
            [ "$OK" = "1" ] && break
          done
          if [ "$OK" != "1" ]; then echo "!! clang 下载失败"; exit 1; fi
          echo "=== 仓库内 clang 版本 ==="
          for D in $HOME/tc/clang-tc/clang-r*; do [ -d "$D" ] && echo "  $(basename $D)"; done
          WANT="clang-r510928"
          CLANG=""
          if [ -x "$HOME/tc/clang-tc/$WANT/bin/clang" ]; then
            CLANG="$HOME/tc/clang-tc/$WANT/bin/clang"
            echo "OK: 命中目标版本 $WANT"
          else
            for CAND in clang-r547379 clang-r536225 clang-r530567 clang-r522817; do
              if [ -x "$HOME/tc/clang-tc/$CAND/bin/clang" ]; then
                CLANG="$HOME/tc/clang-tc/$CAND/bin/clang"
                echo "FALLBACK: 使用 $CAND"
                break
              fi
            done
          fi
          if [ -z "$CLANG" ]; then
            CLANG=$(ls $HOME/tc/clang-tc/clang-r*/bin/clang 2>/dev/null | sort | tail -1)
            echo "FALLBACK2: $CLANG"
          fi
          if [ -z "$CLANG" ]; then echo "!! 找不到 clang"; exit 1; fi
          echo "clang = $CLANG"
          CLANG_DIR=$(dirname "$CLANG")
          echo "CLANG_BIN=$CLANG" >> $GITHUB_ENV
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR" >> $GITHUB_PATH
          "$CLANG" --version | head -2

          clang --version || { echo "!! clang 不可用"; exit 1; }

      # ---------- 内核 defconfig (GKI) ----------
      - name: Configure kernel
        run: |
          cd kernel_src
          mkdir -p out
          # GKI 用 defconfig，这里选 arm64 gki
          make -C . O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 \
            gki_defconfig 2>&1 | tail -10 || {
              echo "!! gki_defconfig 失败，试 defconfig"
              make -C . O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 defconfig 2>&1 | tail -10
            }
          echo "=== 关键配置 ==="
          grep -E 'CONFIG_CFI_CLANG|CONFIG_CFI_PERMISSIVE|CONFIG_MODVERSIONS|CONFIG_LTO_CLANG' out/.config || true

      # ---------- 生成 Module.symvers (关键!) ----------
      - name: Build modules_prepare
        run: |
          cd kernel_src
          make -C . O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 \
            modules_prepare 2>&1 | tail -15

      # ---------- 编 6 个 STEP ----------
      - name: Build mp.ko STEP 0-5
        run: |
          mkdir -p artifacts
          cd minprobe 2>/dev/null || cd .
          for STEP in 0 1 2 3 4 5; do
            echo "=================== STEP=$STEP ==================="
            make -C .. clean >/dev/null 2>&1 || true
            rm -f mp.ko *.o .*.cmd 2>/dev/null || true

            make -C ../kernel_src O=../kernel_src/out \
              M="$PWD" \
              ARCH=arm64 \
              CC=clang LD=ld.lld LLVM=1 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              MP_STEP=$STEP \
              modules 2>&1 | tail -8

            if [ -f mp.ko ]; then
              cp mp.ko "../artifacts/mp_s${STEP}.ko"
              echo "OK: mp_s${STEP}.ko  $(wc -c < mp.ko) bytes"
              echo "--- vermagic ---"
              strings mp.ko | grep '^vermagic=' || echo "(no vermagic)"
              echo "--- kCFI brk count (>0 = CFI 已启用) ---"
              objdump -d mp.ko 2>/dev/null | grep -c 'brk.*0x8222' || echo 0
            else
              echo "!! STEP=$STEP 编译失败"
            fi
          done
          ls -la ../artifacts/

      # ---------- 产物自检 ----------
      - name: Verify artifacts
        run: |
          echo "=== 产物清单 ==="
          ls -la artifacts/
          echo ""
          for f in artifacts/*.ko; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            echo -n "  size: "; stat -c%s "$f"
            echo -n "  vermagic: "; strings "$f" | grep '^vermagic=' | head -1
            echo -n "  kCFI brk: "; objdump -d "$f" 2>/dev/null | grep -c 'brk.*0x8222' || echo 0
            echo -n "  UND count: "; readelf -sW "$f" 2>/dev/null | awk '$7=="UND"' | wc -l
            echo -n "  md5: "; md5sum "$f" | cut -d' ' -f1
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mp-probes
          path: artifacts/*.ko
          if-no-files-found: error